# Menjalankan aplikasi + PostgreSQL:  docker compose up -d --build
# Lalu buat akun admin pertama:     docker compose exec app npm run db:seed
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: simulasi_tka
      POSTGRES_USER: tka
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di berkas .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tka -d simulasi_tka']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tka:${DB_PASSWORD}@db:5432/simulasi_tka
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads

volumes:
  db:
  uploads:
