<body>
  <main class="kartu">

    <p class="redup" id="detail"></p>
    <div class="tombol-baris">
      <button type="button" id="tutup">Tutup aplikasi</button>
      <button type="button" class="utama" id="ulang" autofocus>Coba lagi</button>
    </div>
  </main>
  <script src="galat.js"></script>
