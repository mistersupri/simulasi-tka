# Membuat installer aplikasi ujian Windows dengan alamat server tertanam.
# Jalankan dari tab Actions > "Installer Windows" > Run workflow, isi alamat server.
# Simpan dulu secret repositori (Settings > Secrets and variables > Actions):
#   TKA_KUNCI_APLIKASI  sama dengan KUNCI_APLIKASI di server (opsional)
#   TKA_SANDI_DARURAT   kata sandi pengawas bila server mati (opsional)
name: Installer Windows

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Alamat server ujian, mis. http://192.168.1.10:3000'
        required: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build:win
        env:
          TKA_SERVER_URL: ${{ inputs.server_url }}
          TKA_KUNCI_APLIKASI: ${{ secrets.TKA_KUNCI_APLIKASI }}
          TKA_SANDI_DARURAT: ${{ secrets.TKA_SANDI_DARURAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-ujian-tka
          path: desktop/dist/*.exe
          retention-days: 14
